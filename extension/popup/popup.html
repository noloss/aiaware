<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptSentinel</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="PromptSentinel logo" width="32" height="32" />
    <h1>PromptSentinel</h1>
  </header>

  <main>
    <p id="status">Extension active — monitoring this page.</p>

    <section class="ps-settings">
      <label class="ps-toggle-row" for="shadow-block-toggle">
        <span class="ps-toggle-label">Shadow Block</span>
        <input type="checkbox" id="shadow-block-toggle" />
      </label>
      <p class="ps-setting-desc">
        Block message submission when a 🔴 High sensitive-data alert is active.
        You'll see a Security Intercept popup before anything is sent.
      </p>
    </section>
  </main>

  <script src="popup.js" type="module"></script>
</body>
</html>
