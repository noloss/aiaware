<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptSentinel</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="PromptSentinel logo" width="32" height="32" />
    <h1>PromptSentinel</h1>
  </header>

  <main>
    <p id="status">Extension active — monitoring this page.</p>

    <section class="ps-settings">
      <div class="ps-toggle-row">
        <span class="ps-toggle-label">Shadow Block</span>
        <span class="ps-badge-on">Always on</span>
      </div>
      <p class="ps-setting-desc">
        Enter key submission is automatically blocked when a 🔴 High
        sensitive-data alert is active. A Security Intercept popup will appear
        so you can review before sending.
      </p>
    </section>
  </main>

  <script src="popup.js" type="module"></script>
</body>
</html>
